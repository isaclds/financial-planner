services:
  api-finance-tracker:
    build: ./api-finance-tracker
    ports:
      - "${API_FINANCE_TRACKER_PORT}:3000"
    networks:
      - backend
    volumes:
      - logs/api-finance-tracker:/app/logs
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend:

volumes:
  db_data:
