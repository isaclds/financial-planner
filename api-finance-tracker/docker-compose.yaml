services:
  api-finance-tracker:
    build: .
    env_file:
      - .env
    ports:
      - '${PORT}:${PORT}'
    networks:
      - backend
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432' # APENAS PARA RODAR NPM RUN DEV
    volumes:
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  backend:

volumes:
  db_data:
