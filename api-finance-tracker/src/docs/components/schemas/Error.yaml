type: object
required: [success, status, title, data]
properties:
  success:
    type: boolean
    enum: [false]
  status:
    type: integer
    example: 404
  title:
    type: string
    example: Not Found
  data:
    oneOf:
      - type: string
      - type: object
      - type: array
    description: Mensagem ou detalhes do erro
    example: The ExpenseCategory passed on the id wasn't found
